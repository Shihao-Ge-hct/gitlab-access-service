services:
  gitlab-access-service:
    build:
      context: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      GITLAB_BASE_URL: "https://gitlab.hc.com"
      GITLAB_PROJECT: "infras/ai_infra/gitKrab"
      GITLAB_PIPELINE_REF: "main"
      PIPELINE_POLL_SECONDS: "10"
      PIPELINE_TIMEOUT_MINUTES: "120"
      GITLAB_TOKEN_FILE: "/run/secrets/gitlab-token"
      GITLAB_CA_FILE: "/run/secrets/gitlab-ca"
      AUTH_JWT_PUBLIC_KEY_FILE: "/run/secrets/auth-jwt-public-key"
      AUTH_JWT_ISSUER: "https://sso.example.internal"
      AUTH_JWT_AUDIENCE: "gitlab-access-service"
      SERVICE_PORT: "8080"
    secrets:
      - gitlab-token
      - gitlab-ca
      - auth-jwt-public-key
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  gitlab-token:
    file: ./secrets/gitlab-token
  gitlab-ca:
    file: ./secrets/gitlab-ca.crt
  auth-jwt-public-key:
    file: ./secrets/auth-jwt-public-key.pem
