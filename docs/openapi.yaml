openapi: 3.0.3
info:
  title: GitLab Access Service
  version: 0.1.0
  description: |
    无前端的 GitLab 访问服务。第一版只定义受控的认证、鉴权和
    Windows Pipeline 操作契约，不暴露原始 GitLab API。
servers:
  - url: http://localhost:8080
    description: 本地开发地址
tags:
  - name: health
  - name: access
  - name: pipelines
  - name: jobs
paths:
  /health/live:
    get:
      tags: [health]
      summary: 检查进程是否存活
      responses:
        "200":
          description: Service 进程正常
  /health/ready:
    get:
      tags: [health]
      summary: 检查 Service 是否可以访问 GitLab
      responses:
        "200":
          description: GitLab 连接和项目访问正常
        "503":
          description: Token、CA、TLS 或 GitLab 项目访问异常
  /v1/access/check:
    post:
      tags: [access]
      security:
        - bearerAuth: []
      summary: 检查 Service 到目标 GitLab 项目的访问能力
      responses:
        "200":
          description: 访问检查成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessCheckResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/pipelines:
    post:
      tags: [pipelines]
      security:
        - bearerAuth: []
      summary: 创建受控的 Windows 测试或构建 Pipeline
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineRequest"
      responses:
        "201":
          description: Pipeline 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/UpstreamUnavailable"
  /v1/pipelines/{pipelineId}:
    get:
      tags: [pipelines]
      security:
        - bearerAuth: []
      summary: 查询 Pipeline
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Pipeline 状态
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/pipelines/{pipelineId}/jobs:
    get:
      tags: [pipelines]
      security:
        - bearerAuth: []
      summary: 查询 Pipeline 下的受控 Job
      parameters:
        - $ref: "#/components/parameters/PipelineId"
      responses:
        "200":
          description: Job 列表
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs/{jobId}/play:
    post:
      tags: [jobs]
      security:
        - bearerAuth: []
      summary: 启动白名单中的 manual Job
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job 已启动
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs/{jobId}/trace:
    get:
      tags: [jobs]
      security:
        - bearerAuth: []
      summary: 读取 Job Trace
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: 脱敏后的文本日志
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/jobs/{jobId}/artifacts:
    get:
      tags: [jobs]
      security:
        - bearerAuth: []
      summary: 下载 Job Artifacts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job Artifacts ZIP
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  schemas:
    CreatePipelineRequest:
      oneOf:
        - type: object
          required: [mode, ref]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [build]
            ref:
              $ref: "#/components/schemas/GitRef"
        - type: object
          required: [mode, ref]
          additionalProperties: false
          properties:
            mode:
              type: string
              enum: [test]
            ref:
              $ref: "#/components/schemas/GitRef"
            suites:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum: [rust, unit, e2e]
    GitRef:
      type: string
      minLength: 1
      maxLength: 256
      pattern: "^[A-Za-z0-9][A-Za-z0-9._/@+-]{0,255}$"
    AccessCheckResponse:
      type: object
      required: [gitlabReachable, project, defaultBranch]
      properties:
        gitlabReachable:
          type: boolean
        project:
          type: string
        defaultBranch:
          type: string
    PipelineResponse:
      type: object
      required: [pipelineId, pipelineUrl, ref, mode, targetJobs]
      properties:
        pipelineId:
          type: integer
        pipelineUrl:
          type: string
          format: uri
        ref:
          type: string
        mode:
          type: string
          enum: [build, test]
        targetJobs:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        retryAfterSeconds:
          type: integer
  responses:
    InvalidRequest:
      description: 请求参数非法
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthenticated:
      description: 未通过调用方认证
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 没有执行该操作的权限
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 目标 Pipeline 或 Job 不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UpstreamUnavailable:
      description: GitLab 或 TLS 连接不可用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
